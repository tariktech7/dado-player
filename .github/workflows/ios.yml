name: iOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ios-source-check:
    # The iOS modules are `cfg(target_os = "ios")` and would never be compiled on
    # a Windows runner, so they would rot silently. `--features ios-check`
    # compiles src/platform/ios/{bridge,sys}.rs and src/platform/ios/avplayer.rs on the host
    # without wiring them in. This is a *type check*, not an iOS build: producing
    # libdadoplayer.a needs an Apple SDK (see README.iOS.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-check

      - name: Type-check the iOS ABI layer and player shim
        run: cargo check --features ios-check --lib

      - name: Shell script syntax
        # build_ios.sh is the only path to an IPA and cannot be executed here
        # (no Apple SDK), so at least guarantee it parses. A syntax error found
        # on the macOS runner costs a 10-minute round trip.
        shell: bash
        run: bash -n ios/build.sh

  ios-sdk-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-ios

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-staticlib

      - name: Build unsigned IPA
        # Uses the same script a developer runs locally, so CI and local builds
        # cannot drift. Produces Dado-Player-unsigned.ipa (Payload/DadoPlayer.app).
        run: bash ios/build.sh --ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: dado-player-ios-ipa
          path: Releases/Dado-Player-unsigned.ipa
          if-no-files-found: error

  ios-simulator-playback:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-simulator
      - name: Play bundled MP4 and verify visible video frames
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"]))')
          xcrun simctl boot "$device"
          bash ios/build.sh --sim-app
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" target/simulator/DadoPlayer.app
          SIMCTL_CHILD_IPTV_TEST_STREAM=1 SIMCTL_CHILD_DADO_VIDEO_SMOKE=1 xcrun simctl launch "$device" com.tarik.dadoplayer
          data=$(xcrun simctl get_app_container "$device" com.tarik.dadoplayer data)
          for i in {1..45}; do
            if test -f "$data/Documents/video-ready"; then break; fi
            sleep 1
          done
          xcrun simctl io "$device" screenshot video.png
          test -f "$data/Documents/video-ready"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-playback
          path: video.png
