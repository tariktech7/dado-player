name: Samsung Tizen
on:
  push:
    paths: ['SmartTV/client/**', 'SmartTV/shared/**', 'shared/**', 'release.json', 'assets/**', '.github/workflows/tizen.yml']
  pull_request:
    paths: ['SmartTV/client/**', 'SmartTV/shared/**', 'shared/**', 'release.json', 'assets/**', '.github/workflows/tizen.yml']
  workflow_dispatch:
jobs:
  web-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartTV/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SmartTV/client/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run package
      - run: npm run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: dado-tizen-unsigned
          path: Releases/Dado-Player-Tizen-*-unsigned.wgt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tizen-ui-evidence
          path: SmartTV/client/test-results/
