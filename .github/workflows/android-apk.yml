# =============================================================================
# dado-player - Android APK CI (Rust + eframe 0.27 -> arm64 .so, then Gradle)
#
# Builds the native library with `cargo ndk` and packages/signs the APK with
# Gradle. No local NDK required; everything runs in GitHub Actions (ubuntu-latest).
#
# Triggers:
#   - push to master/main             -> builds Debug APK
#   - push of a v* tag                -> builds Debug AND signed Release APK
#   - pull_request to master/main     -> builds Debug only (no secrets available)
#   - workflow_dispatch               -> manual run (Debug; Release needs secrets)
#
# Required repository secrets for the Release job:
#   SIGNING_KEY         base64-encoded Java keystore (.jks / .keystore)
#   KEY_ALIAS           key alias inside the keystore
#   KEY_PASSWORD        password for the key
#   KEY_STORE_PASSWORD  password for the keystore
#
# Resolved build gaps (all now handled by this workflow / repo):
#   - libmpv.so: fetched from the pinned mpv-android release APK (arm64-v8a),
#       including libmpv's runtime dependencies (libav*, libc++_shared, ...).
#   - GameActivity.java glue: committed at
#       android/app/src/main/java/com/tarik/dadoplayer/GameActivity.java
#   - gradlew: real Gradle 8.9 wrapper committed (gradle-wrapper.jar + scripts).
#   - Rust .so naming: Cargo.toml [lib] name="dadoplayer" -> libdadoplayer.so,
#       matching android.app.lib_name="dadoplayer".
#
# MPV_ANDROID_TAG "2026-09-17" was verified against the upstream releases API;
# that release ships exactly one arm64-v8a APK asset (app-default-arm64-v8a-release.apk).
# NOTE: Action versions and Android/Gradle/NDK versions below should be verified
# against current upstream docs before production use.
# =============================================================================

name: Android APK Build

on:
  push:
    # The local repository uses `master`; keep `main` for forks/mirrors.
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # NDK version pinned to the one requested by the project.
  NDK_VERSION: "27.0.12077973"
  # Android build-tools version used for aapt / zipalign / apksigner.
  BUILD_TOOLS_VERSION: "34.0.0"

jobs:
  # ---------------------------------------------------------------------------
  # Debug build (unsigned). Runs on every push / PR / manual dispatch.
  # ---------------------------------------------------------------------------
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (cmdline-tools)
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Ensure sdkmanager is on PATH
        run: echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: Export NDK home
        run: echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add aarch64-linux-android target
        run: rustup target add aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache cargo-ndk binary
        id: cargo-ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-v0

      - name: Install cargo-ndk (if not cached)
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Build Rust shared library (.so) via cargo-ndk
        # Output is written directly into the Gradle jniLibs source directory.
        run: cargo ndk -t arm64-v8a -o ./android/app/src/main/jniLibs build --locked --release --lib

      # ---- libmpv.so + ffmpeg/c++ deps (arm64-v8a) --------------------------
      # Pull a version-pinned, prebuilt libmpv and its runtime dependencies
      # (libav*, libc++_shared, ...) from the official mpv-android release APK
      # (arm64-v8a). mpv-android statically links ffmpeg into libmpv.so, but the
      # shared objects it depends on at load time must also be present, so we
      # extract the whole arm64-v8a lib folder into jniLibs.
      - name: "Fetch prebuilt libmpv (arm64-v8a) from mpv-android"
        env:
          MPV_ANDROID_TAG: "2026-09-17"
        run: |
          set -euo pipefail
          TARGET_DIR="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$TARGET_DIR"
          API="https://api.github.com/repos/mpv-android/mpv-android/releases/tags/${MPV_ANDROID_TAG}"
          APK_URL="$(curl -sSL "$API" | python3 -c "import sys,json; d=json.load(sys.stdin); print([a['browser_download_url'] for a in d['assets'] if 'arm64-v8a' in a['name'] and a['name'].endswith('.apk')][0])")"
          echo "Downloading $APK_URL"
          curl -fSL -o /tmp/mpv-android.apk "$APK_URL"
          TMP="$(mktemp -d)"
          unzip -o -q /tmp/mpv-android.apk "lib/arm64-v8a/*" -d "$TMP"
          cp "$TMP/lib/arm64-v8a/"*.so "$TARGET_DIR/"
          test -s "$TARGET_DIR/libmpv.so"
          echo "Installed native libs:"; ls -1 "$TARGET_DIR"
      # -----------------------------------------------------------------------

      - name: Generate local.properties from ANDROID_HOME
        run: echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK ABI + native library inventory
        # Catches the classic "APK builds but crashes on device" class of bugs:
        # missing libmpv.so, wrong ABI, or native libs silently dropped by Gradle.
        run: |
          set -euo pipefail
          APK="$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)"
          unzip -l "$APK" 'lib/*' > native-libs.txt
          cat native-libs.txt
          test "$(grep -c 'lib/arm64-v8a/' native-libs.txt || true)" -gt 0
          grep -q 'lib/arm64-v8a/libdadoplayer.so' native-libs.txt
          grep -q 'lib/arm64-v8a/libmpv.so' native-libs.txt
          if grep -qE 'lib/(armeabi-v7a|x86|x86_64)/' native-libs.txt; then
            echo "Unexpected ABI found in APK"; exit 1
          fi
          sha256sum "$APK" > dado-player-debug.apk.sha256
          cat dado-player-debug.apk.sha256

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dado-player-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            dado-player-debug.apk.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release build (signed). Only tag pushes / manual dispatch: repository
  # secrets are unavailable in PRs, and an unsigned "release" on every push
  # would just produce a permanently red job on any fork without secrets.
  # ---------------------------------------------------------------------------
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (cmdline-tools)
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Ensure sdkmanager is on PATH
        run: echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: Export NDK home
        run: echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add aarch64-linux-android target
        run: rustup target add aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache cargo-ndk binary
        id: cargo-ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-v0

      - name: Install cargo-ndk (if not cached)
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Build Rust shared library (.so) via cargo-ndk
        run: cargo ndk -t arm64-v8a -o ./android/app/src/main/jniLibs build --locked --release --lib

      # ---- libmpv.so + ffmpeg/c++ deps (arm64-v8a) --------------------------
      # Keep release packaging identical to debug: fetch the pinned official
      # mpv-android APK and extract every native dependency, not just libmpv.so.
      - name: "Fetch prebuilt libmpv (arm64-v8a) from mpv-android"
        env:
          MPV_ANDROID_TAG: "2026-09-17"
        run: |
          set -euo pipefail
          TARGET_DIR="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$TARGET_DIR"
          API="https://api.github.com/repos/mpv-android/mpv-android/releases/tags/${MPV_ANDROID_TAG}"
          APK_URL="$(curl -sSL "$API" | python3 -c "import sys,json; d=json.load(sys.stdin); print([a['browser_download_url'] for a in d['assets'] if 'arm64-v8a' in a['name'] and a['name'].endswith('.apk')][0])")"
          echo "Downloading $APK_URL"
          curl -fSL -o /tmp/mpv-android.apk "$APK_URL"
          TMP="$(mktemp -d)"
          unzip -o -q /tmp/mpv-android.apk "lib/arm64-v8a/*" -d "$TMP"
          cp "$TMP/lib/arm64-v8a/"*.so "$TARGET_DIR/"
          test -s "$TARGET_DIR/libmpv.so"
          echo "Installed native libs:"; ls -1 "$TARGET_DIR"
      # -----------------------------------------------------------------------

      - name: Generate local.properties from ANDROID_HOME
        run: echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dado-player-release-apk
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          if-no-files-found: error
