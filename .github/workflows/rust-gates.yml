# Reproducible source-quality gates for the Windows-first Rust build.
#
# Kept separate from android-apk.yml: these checks are fast, need no NDK, no
# signing secrets and no device, so every push gets a cheap red/green signal.
# The toolchain is pinned because `-D warnings` turns any newly introduced
# upstream lint into a red build. Local baseline: rustc/clippy 1.99.1, zero
# warnings with `cargo clippy --all-targets -- -D warnings`.

name: Rust QA Gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-test-clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Unit tests
        run: cargo test --all-targets

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

  ios-source-check:
    # The iOS modules are `cfg(target_os = "ios")` and would never be compiled on
    # a Windows runner, so they would rot silently. `--features ios-check`
    # compiles src/platform/ios/{bridge,sys}.rs and src/mpv_ios.rs on the host
    # without wiring them in. This is a *type check*, not an iOS build: producing
    # libdadoplayer.a needs an Apple SDK (see README.iOS.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-check

      - name: Type-check the iOS ABI layer and player shim
        run: cargo check --features ios-check --lib

      - name: Shell script syntax
        # build_ios.sh is the only path to an IPA and cannot be executed here
        # (no Apple SDK), so at least guarantee it parses. A syntax error found
        # on the macOS runner costs a 10-minute round trip.
        shell: bash
        run: bash -n probe/build_ios.sh

  ios-sdk-build:
    # Real iOS compile: Rust staticlib + Swift host. Needs an Apple toolchain,
    # which only macOS runners provide out of the box. Kept non-blocking until
    # the first green run has been observed; flip `continue-on-error` to false
    # once it passes.
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-ios

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-staticlib

      - name: Build Rust static library
        run: |
          cargo build --release --target aarch64-apple-ios --lib
          mkdir -p ios/Vendor
          cp target/aarch64-apple-ios/release/libdadoplayer.a ios/Vendor/

      - name: Verify C ABI symbols
        # Check the symbol TYPE LETTER, never `nm -U`: on Apple nm `-U` means
        # "undefined symbols only" while GNU nm uses `-U` for "defined only", so
        # a flag-based check silently inverts itself depending on the host.
        # T = defined text, U = undefined (provided by the Swift host).
        #
        # The symbol table is captured into a variable rather than piped into
        # `grep -q`: grep exits on first match, nm then dies of SIGPIPE, and
        # GitHub's default `-eo pipefail` turns that into a red step.
        run: |
          set -eu
          lib=ios/Vendor/libdadoplayer.a
          symbols="$(nm -g "$lib")"
          for sym in dado_app_start dado_app_set_storage_dir dado_app_set_env; do
            grep -qE "[[:space:]]T[[:space:]]+_${sym}$" <<<"$symbols" \
              || { echo "missing Rust export: $sym"; exit 1; }
          done
          for sym in dado_host_attach dado_host_load dado_host_video_frame; do
            if grep -qE "[[:space:]]T[[:space:]]+_${sym}$" <<<"$symbols"; then
              echo "$sym is defined in Rust but belongs to Swift"; exit 1
            fi
          done
          echo "ABI symbols OK (3 defined, 3 undefined)"

      - name: Build unsigned IPA
        # Uses the same script a developer runs locally, so CI and local builds
        # cannot drift. Produces Dado-Player-unsigned.ipa (Payload/DadoPlayer.app).
        run: bash probe/build_ios.sh --ipa

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dado-player-ios-ipa
          path: Dado-Player-unsigned.ipa
          if-no-files-found: warn

