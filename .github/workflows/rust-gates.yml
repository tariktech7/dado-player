# Reproducible source-quality gates for the Windows-first Rust build.
#
# Kept separate from android-apk.yml: these checks are fast, need no NDK, no
# signing secrets and no device, so every push gets a cheap red/green signal.
# The toolchain is pinned because `-D warnings` turns any newly introduced
# upstream lint into a red build. Local baseline: rustc/clippy 1.99.1, zero
# warnings with `cargo clippy --all-targets -- -D warnings`.

name: Rust QA Gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-test-clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Unit tests
        run: cargo test --all-targets

      - name: Portable launcher and runtime policy
        shell: pwsh
        run: |
          cargo test --locked --manifest-path packaging/launcher/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s packaging -p test_runtime_policy.py

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
